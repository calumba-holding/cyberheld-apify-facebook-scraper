[project]
name = "ingest-api"
version = "0.1.0"
description = "Evidence-capture Ingest API — the one door (#36)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../metadata-db/src"]
testpaths = ["tests"]

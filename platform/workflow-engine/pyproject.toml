[project]
name = "workflow-engine"
version = "0.1.0"
description = "Evidence-capture durable workflow engine (Temporal) — #37"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2",
    "cryptography>=42",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../metadata-db/src", "../sealing/src", "../capability-router/src"]
testpaths = ["tests"]
asyncio_mode = "auto"

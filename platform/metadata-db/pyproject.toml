[project]
name = "metadata-db"
version = "0.1.0"
description = "Evidence-capture Metadata DB — the queryable index over sealed evidence"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

services:
  metadata-db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: evidence
    ports:
      - "55432:5432"
    volumes:
      - metadata-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evidence"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  metadata-db-data:

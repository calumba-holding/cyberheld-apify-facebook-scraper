[project]
name = "notify"
version = "0.1.0"
description = "Evidence-capture Notify — webhook/email/MCP callback on job completion (#42)"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../metadata-db/src"]
testpaths = ["tests"]
